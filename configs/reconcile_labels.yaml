# ---- Fresh split (added 2026-10-22, after every choice was frozen) -------------------------------
# Life insurers that adopted ASU 2018-12 (LDTI) on 2023-01-01 with a 2021-01-01 transition date and
# restated 2021-22 in the FY2023 10-K. Labels drafted from the filing text by the coding assistant
# (each quote verified verbatim in the filing where the number changed), then spot-checked by the
# author on 2026-10-24 against each company's own adoption table on sec.gov.
# `verified_by` records how strong the evidence is, decided from the filing, not from how any model
# did on the case:
#   tie_out    the company's adoption table adds up: as first reported + effect of ASU 2018-12 =
#              as reported now, for this figure and year
#   narrative  the company says prior-year amounts were adjusted for ASU 2018-12 and names no other
#              cause, but prints no table that ties this figure out
# Results on the fresh split are reported on all labels and on the tie_out labels alone.
# Revenue and cash-flow changes are left unlabelled: the text doesn't tie them to one cause, and
# LDTI can't change cash. LNC is unlabelled throughout: it adopted LDTI AND restated 2021-22 for an
# error (2022 Form 10-K/A), two causes at once, one of them outside our cause list.
AFL:net_income:FY2021: &afl
  cause: accounting_change
  verified_by: narrative
  verified_note: 'no income-statement adoption table; the FY2023 10-K says all relevant prior-year amounts were adjusted for ASU 2018-12 and explains the 2021 premium and benefit changes'
  evidence: '0000004977-24-000053: "On January 1, 2023, the Company adopted Accounting Standards Update (ASU) 2018-12, Financial Services - Insurance: Targeted Improvements to the Accounting for Long-Duration Contracts (LDTI)."'
  anchors:
  - 2018-12
AFL:net_income:FY2022: *afl
