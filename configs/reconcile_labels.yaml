  evidence: '0000320335-24-000006: "The Company adopted ASU 2018-12 on January 1, 2023 using the modified retrospective application as of the transition date of January 1, 2021." (The filing also notes an immaterial correction of an error in the transition amounts; LDTI is the cause of the restatement.)'
  anchors:
