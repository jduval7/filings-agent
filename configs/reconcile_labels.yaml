# Ground-truth causes for answer-key discrepancies. Every label cites the filing text that
# supports it. A discrepancy we can't confirm from the text gets NO label (excluded from cause
# accuracy) rather than a guess.
#
# Causes: stock_split | discontinued_operations | accounting_change | reclassification
# Immaterial discrepancies (< 0.5% spread) are auto-resolved in code and not listed here.
# anchors: verbatim phrases from the explaining passage; verified to appear in the filing(s)
# where the number changed. The retrieval eval asks: did search return a passage containing one?

