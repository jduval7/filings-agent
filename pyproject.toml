[project]
name = "filings-agent"
version = "0.1.0"
description = "Parallel SEC 10-K fact extraction and reconciliation agent (LangGraph + LangSmith)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentevals>=0.0.9",
    "boto3>=1.43.114",
    "edgartools>=5.62",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langchain>=1.0",
    "langchain-aws>=1.9.0",
    "langchain-core>=1.6.12",
    "langchain-openai>=1.7",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langsmith>=0.14.11",
    "pydantic>=2.8",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
filings-agent = "filings_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyright>=1.1.380",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
    "boto3-stubs[bedrock-runtime]>=1.43.114",
    "pytest-cov>=7.1.0",
    "langgraph-cli[inmem]>=0.4.36",
    "langgraph-api>=0.11.0",
    "hypothesis>=6.170.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filings_agent"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits the live SEC API (deselect with -m 'not network')"]
addopts = "-m 'not network'"
